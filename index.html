<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste to Word — AI Math Converter</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        .preview-pane { font-family: Georgia, 'Times New Roman', serif; }
        .preview-pane table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; }
        .preview-pane th, .preview-pane td { border: 1px solid #94a3b8; padding: 0.6rem 0.9rem; }
        .preview-pane th { background: #f1f5f9; font-weight: 700; }
        .preview-pane h1 { font-size: 1.9em; font-weight: 700; margin: 1.4rem 0 0.6rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.2rem; }
        .preview-pane h2 { font-size: 1.5em; font-weight: 700; margin: 1.2rem 0 0.5rem; }
        .preview-pane h3 { font-size: 1.2em; font-weight: 700; margin: 1rem 0 0.4rem; }
        .preview-pane p  { margin-bottom: 0.9rem; line-height: 1.75; }
        .preview-pane ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 0.9rem; }
        .preview-pane ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 0.9rem; }
        .preview-pane li { margin-bottom: 0.3rem; line-height: 1.6; }
        .preview-pane blockquote { border-left: 4px solid #3b82f6; background: #eff6ff; padding: 0.8rem 1rem; margin: 1rem 0; font-style: italic; color: #1e40af; }
        .preview-pane code { background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 3px; font-size: 0.88em; font-family: monospace; }
        .preview-pane pre { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 6px; overflow-x: auto; margin: 1rem 0; }
        .preview-pane pre code { background: none; color: inherit; padding: 0; }
        .preview-pane strong { font-weight: 700; }
        .preview-pane em { font-style: italic; }
        .preview-pane u  { text-decoration: underline; }
        .preview-pane .katex { font-size: 1.05em; }
        .preview-pane .katex-display { margin: 1rem 0; overflow-x: auto; }

        #statusBar { transition: opacity 0.3s; }
    </style>
</head>

<body class="bg-slate-50 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-500 text-white px-5 py-3 shadow-lg flex justify-between items-center shrink-0">
        <div>
            <h1 class="text-lg font-bold tracking-wide leading-tight">Paste to Word</h1>
            <p class="text-[11px] text-blue-200 mt-0.5">AI Math &amp; Science → Perfect .docx every time</p>
        </div>
        <div class="flex items-center gap-3">
            <span id="statusBar" class="text-xs text-blue-200 opacity-0"></span>
            <button id="exportBtn"
                class="bg-white text-blue-700 px-5 py-2 rounded-md shadow font-bold text-sm
                       hover:bg-blue-50 active:scale-95 transition-all flex items-center gap-2
                       disabled:opacity-60 disabled:cursor-not-allowed">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span id="btnText">Download .docx</span>
            </button>
        </div>
    </header>

    <!-- Workspace -->
    <main class="flex-1 flex overflow-hidden">

        <!-- Input -->
        <section class="w-1/2 border-r border-slate-200 flex flex-col bg-white">
            <div class="px-4 py-2 bg-slate-100 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-widest flex items-center justify-between">
                <span>Markdown / AI Response Input</span>
                <button id="clearBtn" class="text-slate-400 hover:text-red-400 text-[11px] font-normal normal-case tracking-normal transition-colors">Clear</button>
            </div>
            <textarea id="markdownInput"
                class="flex-1 w-full p-5 resize-none focus:outline-none font-mono text-[13px] leading-relaxed text-slate-800 placeholder-slate-300"
                placeholder="Paste your AI response here — supports:&#10;• LaTeX math:  \( E = mc^2 \)  or  \[ \int_0^\infty e^{-x}\,dx = 1 \]&#10;• Dollar math: $x^2 + y^2 = r^2$ or $$\frac{d}{dx}f(x)$$&#10;• **Bold**, *italic*, __underline__ (via &lt;u&gt;text&lt;/u&gt;)&#10;• Tables, lists, headings, blockquotes, code blocks"></textarea>
        </section>

        <!-- Preview -->
        <section class="w-1/2 flex flex-col bg-white">
            <div class="px-4 py-2 bg-slate-100 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-widest flex items-center justify-between">
                <span>Live Preview</span>
                <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold normal-case tracking-normal">KaTeX Active</span>
            </div>
            <div id="previewOutput" class="preview-pane flex-1 px-8 py-6 overflow-y-auto text-slate-800"></div>
        </section>

    </main>

    <script>
    // ─── Configuration ────────────────────────────────────────────────────────
    // When the SPA is on GitHub Pages, point to the Vercel API URL.
    // When served from Vercel itself, use relative path.
    const API_URL = (() => {
        if (window.location.hostname.endsWith('github.io') ||
            window.location.hostname.endsWith('github.com')) {
            return 'VERCEL_API_URL_PLACEHOLDER';   // replaced at deploy time
        }
        return '/api/convert';  // same-origin (Vercel)
    })();

    // ─── Elements ─────────────────────────────────────────────────────────────
    const input     = document.getElementById('markdownInput');
    const preview   = document.getElementById('previewOutput');
    const exportBtn = document.getElementById('exportBtn');
    const btnText   = document.getElementById('btnText');
    const statusBar = document.getElementById('statusBar');
    const clearBtn  = document.getElementById('clearBtn');

    // ─── Normalize AI math delimiters for preview ─────────────────────────────
    // Converts \( \) and \[ \] to $ $ and $$ $$ for KaTeX auto-render.
    function normalizeMath(text) {
        // Use non-greedy DOTALL matches. Replace single-char by char to avoid
        // JS replacement string pitfalls with $ signs.
        text = text.replace(/\\\(([\s\S]+?)\\\)/g, (_, m) => `$${m}$`);
        text = text.replace(/\\\[([\s\S]+?)\\\]/g, (_, m) => `$$${m}$$`);
        return text;
    }

    // ─── Live Preview ─────────────────────────────────────────────────────────
    function renderPreview() {
        const raw = input.value;
        if (!raw.trim()) { preview.innerHTML = ''; return; }

        const normalized = normalizeMath(raw);
        preview.innerHTML = marked.parse(normalized);

        renderMathInElement(preview, {
            delimiters: [
                { left: '$$', right: '$$', display: true  },
                { left: '$',  right: '$',  display: false }
            ],
            throwOnError: false,
            errorColor: '#e11d48'
        });
    }

    let previewTimer;
    input.addEventListener('input', () => {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(renderPreview, 120);
    });

    clearBtn.addEventListener('click', () => {
        input.value = '';
        preview.innerHTML = '';
    });

    // ─── Status helper ────────────────────────────────────────────────────────
    function setStatus(msg, colour = 'text-blue-200') {
        statusBar.textContent = msg;
        statusBar.className = `text-xs ${colour} opacity-100`;
    }
    function clearStatus() {
        statusBar.style.opacity = '0';
    }

    // ─── Export via Pandoc server ──────────────────────────────────────────────
    exportBtn.addEventListener('click', async () => {
        const markdown = input.value.trim();
        if (!markdown) { alert('Paste some content first.'); return; }

        exportBtn.disabled = true;
        btnText.textContent = 'Converting…';
        setStatus('Sending to pandoc server…');

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ markdown })
            });

            if (!res.ok) {
                let detail = '';
                try { detail = (await res.json()).error; } catch (_) {}
                throw new Error(detail || `Server error ${res.status}`);
            }

            setStatus('Packaging .docx…');
            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = Object.assign(document.createElement('a'), {
                href: url, download: 'AI_Response.docx'
            });
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            setStatus('✓ Download complete', 'text-emerald-300');
            setTimeout(clearStatus, 3000);

        } catch (err) {
            console.error(err);
            setStatus('✗ ' + err.message, 'text-red-300');
            setTimeout(clearStatus, 6000);
            alert('Export failed: ' + err.message + '\n\nCheck the browser console for details.');
        } finally {
            exportBtn.disabled = false;
            btnText.textContent = 'Download .docx';
        }
    });

    // Initial render
    renderPreview();
    </script>
</body>
</html>
